services:
  redis:
    image: redis:7-alpine
    container_name: courage_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: courage_backend
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
      - courage_db:/app/data
    restart: unless-stopped

volumes:
  redis_data:
  courage_db:
